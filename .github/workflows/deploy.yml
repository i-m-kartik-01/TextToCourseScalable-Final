name: CI + Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

  deploy:
    name: Deploy Backend to EC2
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Debug Secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "EC2_HOST is EMPTY"
            exit 1
          else
            echo "EC2_HOST exists"
          fi
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "========== DEPLOY START =========="

            cd /home/ubuntu/TextToCourseScalable-Final

            echo "Updating source..."
            git fetch origin
            git reset --hard origin/main

            cd server

            npm install

            pm2 restart course-api --update-env
            pm2 restart course-worker --update-env
            pm2 restart lesson-worker --update-env
            pm2 restart quiz-worker --update-env

            pm2 save

            sleep 5

            curl -f http://localhost:5010/health

            echo "========== DEPLOY SUCCESS =========="